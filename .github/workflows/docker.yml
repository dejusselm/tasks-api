name: docker
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/${{ github.event.repository.name }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev'}}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="sha-${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${REPO_OWNER}/${{ github.event.repository.name }}:${TAG}"

          docker pull $IMAGE
          docker run -d --name tasks-api-staging -p 8000:8000 $IMAGE

      - run: |
          for i in {1..15}; do
            if curl -s -f http://localhost:8000/health && curl -s -f http://localhost:8000/version; then
              echo "Staging smoke test passed!"
              exit 0
            fi
            sleep 2
          done
          echo "Staging smoke test failed!"
          exit 1

      - if: always()
        run: docker stop tasks-api-staging || true

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="sha-${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${REPO_OWNER}/${{ github.event.repository.name }}:${TAG}"

          docker pull $IMAGE
          docker run -d --name tasks-api-prod -p 8000:8000 $IMAGE

      - run: |
          for i in {1..15}; do
            if curl -s -f http://localhost:8000/health && curl -s -f http://localhost:8000/version; then
              echo "Staging smoke test passed!"
              exit 0
            fi
            sleep 2
          done
          echo "Staging smoke test failed!"
          exit 1

      - if: always()
        run: docker stop tasks-api-prod || true

  update-config:
    runs-on: ubuntu-latest
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: dejusselm/tasks-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - env:
          VERSION: ${{ github.ref_name }}
        run: bash $GITHUB_WORKSPACE/scripts/set-image-tag.sh config/config/k8s/deployment.yaml "${VERSION#v}"

      - env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd config
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "ci: update image tag to ${VERSION}" || echo "No changes to commit"
          git push
