name: Secret_demo

on: workflow_dispatch
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN_CHECK: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -z "$TOKEN_CHECK" ]; then
            exit 1
          fi

      - env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "$TOKEN"
          echo " ${{ vars.APP_ENV }}"
