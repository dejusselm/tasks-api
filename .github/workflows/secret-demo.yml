name: Secret
on: workflow_dispatch
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - if: ${{ secrets.DEMO_TOKEN }} == ''
        run: echo "exit 1"

      - run: echo ${"DEMO_TOKEN"}
      - run: echo ${{ secrets.DEMO_TOKEN }}
      - run: echo ${{ vars.APP_ENV }}
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
