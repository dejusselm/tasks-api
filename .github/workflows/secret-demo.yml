name: Secret
on: workflow_dispatch
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN_CHECK: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -z "$TOKEN_CHECK" ]; then
            echo "Erreur : DEMO_TOKEN est vide ou manquant."
            exit 1
          fi

      - env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "Le token (masqué) est : $TOKEN"
          echo "L'environnement est : ${{ vars.APP_ENV }}"
